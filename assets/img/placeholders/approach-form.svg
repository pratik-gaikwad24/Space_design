<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <!-- ILLUSTRATION PLACEHOLDER: FORM (axonometric massing). -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7EBEF"/></linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="#E9EDF1"/>
  <!-- block A -->
  <polygon points="300,700 600,550 900,700 600,850" fill="url(#top)"/>
  <polygon points="300,700 600,850 600,1250 300,1100" fill="#C4CDD5"/>
  <polygon points="600,850 900,700 900,1100 600,1250" fill="#9DA9B4"/>
  <!-- block B stacked, rotated offset -->
  <polygon points="420,470 680,340 900,450 640,580" fill="url(#top)"/>
  <polygon points="420,470 640,580 640,700 420,590" fill="#D2D9DF"/>
  <polygon points="640,580 900,450 900,570 640,700" fill="#AEB9C3"/>
  <!-- slot -->
  <polygon points="600,850 700,800 700,1200 600,1250" fill="#15191D" opacity=".8"/>
  <!-- blue edge -->
  <line x1="600" y1="850" x2="600" y2="1250" stroke="#0066B1" stroke-width="4"/>
  <polygon points="100,1240 600,1490 1100,1240" fill="#15191D" opacity=".06"/>
</svg>
