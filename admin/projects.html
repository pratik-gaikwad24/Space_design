<!doctype html>
<html lang="en-IN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects | Space Design Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/roboto-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/accessibility.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/boot.js"></script>
</head>
<body class="admin" data-page="admin" data-admin-page="projects">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-loading" data-admin-loading role="status">Checking access…</div>
<div class="admin-shell" data-admin-shell hidden>
  <div class="admin-mobile-bar" data-admin-bar>
    <span class="brand"><span class="brand-text"><span class="brand-name">SPACE DESIGN</span></span></span>
    <button type="button" aria-expanded="false" aria-controls="admin-sidebar">Menu</button>
  </div>
  <aside class="admin-sidebar" id="admin-sidebar" data-admin-sidebar aria-label="Admin navigation"></aside>
  <main class="admin-main" id="main" tabindex="-1">
    <header class="admin-head">
      <div><span class="label label--blue">Portfolio CMS</span><h1>Projects</h1></div>
      <div class="admin-actions"><a class="btn btn--sm" href="project-editor.html">New project <span class="btn-arrow" aria-hidden="true">→</span></a></div>
    </header>
    <div class="toolbar">
      <div class="field"><label for="p-search">Search</label><input id="p-search" type="search" data-projects-search placeholder="Title, slug, location…"></div>
      <div class="seg" role="group" aria-label="Filter projects" data-projects-filter>
        <button type="button" aria-pressed="true" data-filter="all">All</button>
        <button type="button" aria-pressed="false" data-filter="published">Published</button>
        <button type="button" aria-pressed="false" data-filter="draft">Drafts</button>
        <button type="button" aria-pressed="false" data-filter="featured">Featured</button>
      </div>
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table class="table">
          <caption class="visually-hidden">Projects</caption>
          <thead><tr><th scope="col"><span class="visually-hidden">Cover</span></th><th scope="col">Project</th><th scope="col">Category</th><th scope="col">Status</th><th scope="col">Updated</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody data-projects-body><tr><td colspan="6" class="table-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="../js/config.js" defer></script>
<script src="../js/vendor/supabase.js" defer></script>
<script src="../js/utils.js" defer></script>
<script src="../js/supabase.js" defer></script>
<script src="../js/seo.js" defer></script>
<script src="../js/auth.js" defer></script>
<script src="../js/admin.js" defer></script>
</body>
</html>
